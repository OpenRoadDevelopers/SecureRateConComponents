<template> 
    <template if:true={isModalOpen}>
        <section 
            role="dialog" 
            tabindex="-1" 
            class="slds-modal slds-fade-in-open">
            
            <div class="slds-modal__container email-modal-container">

                <header class="slds-modal__header">
                    
                    <h2 class="slds-text-heading_medium">Send Email</h2>
                </header>
                <template if:true={isLoading}>
                    <div class="slds-modal__content slds-p-around_small email-modal-content">
                        <div class="slds-spinner slds-spinner_medium slds-spinner_brand">
                            <span class="slds-assistive-text">Loading</span>
                            <div class="slds-spinner__dot-a"></div>
                            <div class="slds-spinner__dot-b"></div>
                        </div>
                    </div>
                </template>
                <template if:false={isLoading}>
                    <div class="slds-modal__content slds-p-around_small email-modal-content">
                        <div class="email-fields-section">
                            <lightning-input 
                                label="From" 
                                type="email"
                                value={userEmail} 
                                disabled
                                >
                            </lightning-input>

                            <lightning-input 
                                label="To" 
                                type="email"
                                value={toEmails} 
                                onchange={handleChange}
                                >
                            </lightning-input>
                        
                            <lightning-combobox 
                                name="template"
                                label="Email Template"
                                value={selectedTemplate}
                                placeholder="Select a template"
                                options={templateOptions}
                                onchange={handleTemplateChange}
                                class="slds-m-bottom_small">
                            </lightning-combobox>

                            <lightning-input 
                                label="Subject" 
                                value={subject} 
                                onchange={handleChange}
                                >
                            </lightning-input>
                        </div>
                        <div class="message-body-section">
                            <lightning-input-rich-text 
                                label="Body" 
                                value={body} 
                                onchange={handleChange}
                                label-visible
                                class="message-body-input">
                            </lightning-input-rich-text>
                        </div>

                    </div>
                </template>
                <footer class="slds-modal__footer">
                    <lightning-button 
                        label="Cancel" 
                        onclick={closeModal}>
                    </lightning-button>
                    
                    <lightning-button 
                        variant="brand" 
                        label="Send" 
                        onclick={sendEmail}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
