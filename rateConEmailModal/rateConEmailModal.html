<template> 
    <template if:true={isModalOpen}>
        <section 
            role="dialog" 
            tabindex="-1" 
            class="slds-modal slds-fade-in-open">
            
            <div class="slds-modal__container email-modal-container">

                <header class="slds-modal__header">
                    
                    <h2 class="slds-text-heading_medium">Send Email</h2>
                </header>
                <template if:true={isLoading}>
                    <div class="slds-modal__content slds-p-around_small email-modal-content">
                        <div class="slds-spinner slds-spinner_medium slds-spinner_brand">
                            <span class="slds-assistive-text">Loading</span>
                            <div class="slds-spinner__dot-a"></div>
                            <div class="slds-spinner__dot-b"></div>
                        </div>
                    </div>
                </template>
                <template if:false={isLoading}>
                    <template if:true={isError}>
                        <div class="slds-modal__content slds-p-around_small email-modal-content">
                            <p class="error-message">An error occurred while fetching data. Please try again later.</p>
                        </div>
                    </template>
                    <template if:false={isError}>
                        <div class="slds-modal__content slds-p-around_small email-modal-content">
                            <div class="email-fields-section">

                                <lightning-input 
                                    label="Carrier Quote" 
                                    type="text"
                                    value={quoteInfo} 
                                    disabled
                                    >
                                </lightning-input>

                                <lightning-input 
                                    label="From" 
                                    type="email"
                                    value={userEmail} 
                                    disabled
                                    >
                                </lightning-input>

                                <div class="to-wrapper">
                                    <label class="to-label">To</label>
                                    <div class="to-chips" role="list">
                                        <template if:true={toEmails.length}>
                                        <template for:each={toEmails} for:item="email">
                                            <span key={email} class="email-pill" role="listitem">{email}</span>
                                        </template>
                                        </template>
                                        <template if:false={toEmails.length}>
                                        <span class="placeholder">No recipients selected</span>
                                        </template>
                                    </div>
                                </div>

                                <lightning-input
                                    type="search"
                                    label="Search Users"
                                    value={userSearch}
                                    onchange={handleUserSearch}>
                                </lightning-input>

                                <div class="slds-card slds-card_boundary" style="height: 300px; background-color:#f2f2f2; border-radius: 5px; overflow: auto; padding: 3px;">
                                    <lightning-datatable
                                        key-field="Id"
                                        data={filteredUsers}
                                        columns={usersColumns}
                                        hide-table-header="true"
                                        onrowselection={handleUserSelection}
                                        selected-rows={userSelectedIds}
                                    >
                                    </lightning-datatable>
                                </div>
                            </div>
                        </div>
                    </template>
                </template>
                <footer class="slds-modal__footer">
                    <lightning-button 
                        label="Cancel" 
                        onclick={closeModal}>
                    </lightning-button>
                    
                    <lightning-button 
                        variant="brand" 
                        label="Send" 
                        onclick={sendEmail}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
