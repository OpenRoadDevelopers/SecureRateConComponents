<template>
    <lightning-card title="Secure Rate Confirmation" icon-name="standard:quotes">
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-vertical_medium">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>
        <template if:false={isLoading}>
           
            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-end slds-nowrap">
                <div class={toggleClass}>
                    <lightning-input 
                        type="toggle" 
                        style="transform: scale(1.5); transform-origin: right center;"
                        label="Use Secure Rate Con"
                        checked={isRequireRateCon}
                        message-toggle-active="On"
                        message-toggle-inactive="Off"
                        onchange={handleRequireRateConChange}
                        disabled={isRequireRateConDisabled}>
                    </lightning-input>
                </div>
                
                <lightning-helptext class="slds-m-right_x-large" content={infobubble}>
                </lightning-helptext>
                <div class="slds-grid slds-grid_vertical-align-center slds-m-left_auto">
                    <template if:true={isShowButton}>
                        <div class="slds-m-bottom_small slds-m-left_small">
                            <lightning-button
                                class = 'slds-m-right_small'
                                variant="brand"
                                label={buttonName}
                                title={buttonName}
                                icon-name="utility:forward"
                                icon-position="right"
                                onclick={handleUpdate}>
                            </lightning-button>
                        </div>
                    </template>
                    
                </div>
                <!-- <template if:true={isShowStatus}>
                    <div class="slds-m-top_medium slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <div class="slds-box slds-box_x-small slds-theme_default">
                                <p class="slds-text-title_caps slds-text-color_weak">
                                    Date and Time
                                </p>
                                <p class="slds-text-heading_small">
                                    {datetime}
                                </p>
                            </div>
                        </div>
                    </div>
                </template> -->
            </div>
        </template>
    </lightning-card>

    <!-- <c-carrier-quote-modal
        onnextmodal={handleNextModal}>
    </c-carrier-quote-modal>

    <c-rate-con-email-modal>
    </c-rate-con-email-modal> -->
</template>
