<template> 
    <template if:true={isModalOpen}>
        <section 
            role="dialog" 
            tabindex="-1" 
            class="slds-modal slds-fade-in-open">
            
            <div class="slds-modal__container carrier-quote-modal-container">

                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Carrier Quote</h2>
                </header>
                <template if:true={isLoading}>
                    <div class="slds-modal__content slds-p-around_small carrier-quote-modal-content">
                        <div class="slds-spinner slds-spinner_medium slds-spinner_brand">
                            <span class="slds-assistive-text">Loading</span>
                            <div class="slds-spinner__dot-a"></div>
                            <div class="slds-spinner__dot-b"></div>
                        </div>
                    </div>
                </template>
                <template if:false={isLoading}>
                    <template if:true={noData}>
                        <div class="slds-modal__content slds-p-around_small slds-text-align_center">
                            <p>No Carrier Quotes Found</p>
                        </div>
                    </template>
                    <template if:false={noData}>
                        <div class="slds-modal__content slds-p-around_small carrier-quote-modal-content">
                            <div class="carrier-quote-fields-section">
                                <div class="scrollable-table">
                                    <table class="contact-table slds-table slds-table_cell-buffer slds-table_bordered">
                                        <thead>
                                            <tr>
                                                <th scope="col"></th>
                                                <th scope="col"><div class="slds-truncate">Carrier Service</div></th>
                                                <th scope="col"><div class="slds-truncate">DOT #</div></th>
                                                <th scope="col"><div class="slds-truncate">MC #</div></th>
                                                <th scope="col"><div class="slds-truncate">Carrier Total</div></th>
                                                <th scope="col"><div class="slds-truncate">Accepted</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={quotes} for:item="quote" for:index="index">
                                                <tr key={quote.Id} > 
                                                    <td>
                                                        <lightning-input 
                                                            type="checkbox" 
                                                            label={quote.label} 
                                                            checked={quote.isSelected}
                                                            data-value={quote.rtms__Carrier_Service__r.rtms__Carrier__c}
                                                            data-quote-id={quote.Id}
                                                            disabled={quote.isDisabled}
                                                            onchange={handleSelect}>
                                                        </lightning-input>
                                                    </td>
                                                    <td>{quote.rtms__Carrier_Service__r.Name}</td>
                                                    <td>{quote.rtms__Carrier_Service__r.UD_DOT__c}</td>
                                                    <td>{quote.rtms__Carrier_Service__r.MC__c}</td>
                                                    <td>{quote.rtms__Carrier_Total__c}</td>
                                                    <td>{quote.rtms__Accepted__c}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </template>
                </template>
                <footer class="slds-modal__footer">
                    <lightning-button 
                        label="Cancel" 
                        onclick={closeModal}>
                    </lightning-button>
                    
                    <lightning-button 
                        variant="brand" 
                        label="Next" 
                        onclick={nextModal}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
